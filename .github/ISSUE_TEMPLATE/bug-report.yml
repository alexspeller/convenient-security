name: Bug report
description: Something csec does that it should not, or fails to do.
body:
  - type: markdown
    attributes:
      value: >-
        Never paste a secret value, token, private key or `.env` contents, even a
        revoked one. Secret references (`op://…`, `csec://…`) and command lines with
        values removed are fine. Suspected vulnerabilities go to the Security tab
        instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected and what csec did instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: csec version
      description: >-
        The output of `defaults read /Applications/ConvenientSecurity.app/Contents/Info.plist
        CFBundleShortVersionString`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: csec doctor output
      description: >-
        The output of `csec doctor`. It holds no secret values, but it names references
        and accounts, so remove any you would rather not post.
      render: text
