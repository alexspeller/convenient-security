name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-and-ruby:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain report
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          ruby --version
      - name: Build and test
        run: bin/ci
